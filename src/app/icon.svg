<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Pictograma aplicației. Convenție Next.js App Router: fiind `src/app/icon.svg`,
    e legat automat în <head>, fără nimic în layout.tsx.

    Perechea cu `favicon.ico` de alături nu e redundanță. Next alege un singur
    fișier per nume de convenție: cu `icon.svg` și `icon.png` puse împreună,
    verificarea în HTML-ul randat a arătat că îl leagă doar pe al doilea, iar
    SVG-ul rămâne greutate moartă. `favicon.ico` e altă convenție, deci se
    adaugă în loc să concureze — .ico pentru browserele fără suport SVG, SVG-ul
    pentru restul, clar la orice mărime și zoom.

    Trei rânduri albe pe pătrat bleumarin (culoarea „primary” din temă, hsl 215
    25% 17%): o listă, adică o evidență. Nu o bifă, deși prima variantă asta era
    — bifa spune „sarcină făcută”, iar sarcinile sunt azi unul din șapte
    registre.

    Atenție la comentariul ăsta: XML interzice secvența din două cratime în
    interiorul unui comentariu. Scris ca numele variabilei CSS, cu prefixul ei,
    fișierul devine XML invalid și browserul refuză să-l deseneze — tăcut, cu
    iconița lipsă, fiindcă ruta răspunde oricum 200. Așa a și fost livrat o dată.

    Trei trăsături groase, și nimic mai mult, fiindcă la 16×16 — mărimea reală
    dintr-o filă — orice detaliu fin se face pastă. Variantele desenate și
    picate la proba asta: cheia (la 16px se citește ca o lupă, deci ca un buton
    de căutare) și inițialele „ED” (ilizibile).
  -->
  <rect width="64" height="64" rx="14" fill="#212a36"/>
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <path d="M19 23h26"/>
    <path d="M19 33h26"/>
    <path d="M19 43h16"/>
  </g>
</svg>
